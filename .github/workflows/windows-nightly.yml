# Builds everything and runs the tests on Windows (the product's platform), with MSVC and
# with MinGW (Qt's own builds of each), once a night on master, and by hand. Not on pull
# requests: a Windows run takes about 20 minutes, and Windows is tested locally before a
# merge (see docs/testing.md). A night with no new commits on master is skipped (by hand,
# it always runs). Without Steinberg's ASIO SDK, which isn't redistributable: the ASIO
# tests skip. Compiles go through ccache (sccache for MSVC), its cache kept between runs.
name: Windows nightly

on:
  schedule:
    - cron: '0 7 * * *'  # 07:00 UTC
  workflow_dispatch:

# Checkout, and reading this workflow's past runs (whether master moved since the last).
permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Whether master has moved since the last nightly that ran.
  changed:
    name: New commits?
    runs-on: ubuntu-24.04
    outputs:
      any: ${{ steps.check.outputs.any }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != schedule ]; then echo any=true >> "$GITHUB_OUTPUT"; exit 0; fi
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/windows-nightly.yml/runs?event=schedule&status=completed&per_page=20" --jq '[.workflow_runs[] | select(.conclusion != "skipped" and .conclusion != "cancelled")][0].head_sha // ""')
          if [ "$last" = "${{ github.sha }}" ]; then echo "master is still at $last: nothing new"; echo any=false >> "$GITHUB_OUTPUT"
          else echo any=true >> "$GITHUB_OUTPUT"; fi

  windows:
    name: Windows (MSVC, Qt 6.8)
    needs: changed
    if: needs.changed.outputs.any == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: A 1920x1080 screen (the UI tests' windows don't fit the runner's 1024x768)
        shell: powershell
        continue-on-error: true
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      # (sccache caches nothing compiled with /Zi: Release has no debug information)
      - uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639  # v1.2
        with:
          key: windows-msvc
          variant: sccache
          max-size: 2G
      - name: Configure
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DSUBSTATION_BUILD_BENCHMARKS=ON -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      - name: Build
        run: ninja -C build -k 0
      - name: Test
        run: ctest --test-dir build --output-on-failure -j4

  windows-mingw:
    name: Windows (MinGW, Qt 6.8)
    needs: changed
    if: needs.changed.outputs.any == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: A 1920x1080 screen (the UI tests' windows don't fit the runner's 1024x768)
        shell: powershell
        continue-on-error: true
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_mingw
          tools: 'tools_mingw1310 tools_ninja'
          cache: true
      - name: Use Qt's MinGW and Ninja
        shell: pwsh
        run: |
          "$env:IQTA_TOOLS\mingw1310_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$env:IQTA_TOOLS\Ninja" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639  # v1.2
        with:
          key: windows-mingw
          max-size: 2G
      - name: Configure
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: ninja -C build -k 0
      - name: Test
        run: ctest --test-dir build --output-on-failure -j4
