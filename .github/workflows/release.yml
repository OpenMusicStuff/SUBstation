# Releases (docs/releasing.md): builds SUBstation for Windows and publishes it as a
# GitHub release, which the updater in SUBstation offers (Preferences › Updates). Three
# channels:
#
# - stable: a tag v<MAJOR.MINOR.PATCH> pushed (it must be CMakeLists.txt's VERSION): a
#   release, the repository's latest;
# - nightly: once a night, if master moved since the last nightly: a pre-release tagged
#   v<VERSION>-nightly.<UTC yyyyMMddHHmm>; the newest 7 are kept;
# - canary: each push to master: a pre-release tagged v<VERSION>-canary.<stamp>; the
#   newest 10 are kept. A newer push cancels the build of an older one.
#
# By hand (workflow_dispatch), any channel from the branch chosen (stable: from its tag).
# The downloads are SUBstation-<version>-windows-x64-setup.exe (the installer) and
# SUBstation-<version>-windows-x64.zip (portable), each with its .sha256
# (tools/release/package-windows.ps1, tools/release/substation.iss). Built with Steinberg's
# ASIO SDK (downloaded, pinned, under its GPLv3 option), without the tests (the CI and
# Windows nightly workflows run them), and signed with Azure Artifact Signing once its
# secrets are set.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    branches: [master]
  schedule:
    - cron: '30 7 * * *'  # 07:30 UTC (after the Windows nightly's tests)
  workflow_dispatch:
    inputs:
      channel:
        description: The channel to release on
        type: choice
        options: [canary, nightly, stable]
        default: canary

# Creating releases and their tags; reading this workflow's past runs.
permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

jobs:
  # What to release: the channel, the version, the tag; whether there's anything new.
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      version: ${{ steps.plan.outputs.version }}
      suffix: ${{ steps.plan.outputs.suffix }}
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          base=$(sed -nE 's/^project\(SUBstation VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          [ -n "$base" ] || { echo "No VERSION in CMakeLists.txt"; exit 1; }
          if [ "$EVENT" = workflow_dispatch ]; then channel=$INPUT_CHANNEL
          elif [ "$EVENT" = schedule ]; then channel=nightly
          elif [ "$REF_TYPE" = tag ]; then channel=stable
          else channel=canary; fi
          release=true
          stamp=$(date -u +%Y%m%d%H%M)
          if [ "$channel" = stable ]; then
            suffix=""
            version=$base
            tag="v$version"
            if [ "$REF_TYPE" != tag ] || [ "$REF_NAME" != "$tag" ]; then
              echo "A stable release is made from its tag ($tag, CMakeLists.txt's VERSION), not from $REF_NAME."; exit 1
            fi
          else
            suffix="$channel.$stamp"
            version="$base-$suffix"
            tag="v$version"
          fi
          if [ "$channel" = nightly ] && [ "$EVENT" = schedule ]; then
            # Nothing new since the last nightly: no release.
            last=$(git tag --list "v*-nightly.*" | sort -t. -k4,4nr | head -n1)
            if [ -n "$last" ] && [ "$(git rev-parse "$last^{commit}")" = "$(git rev-parse HEAD)" ]; then
              echo "master is still at $last: nothing new"; release=false
            fi
          fi
          echo "$channel $version ($tag), release: $release"
          {
            echo "channel=$channel"; echo "version=$version"; echo "suffix=$suffix"
            echo "tag=$tag"; echo "release=$release"
          } >> "$GITHUB_OUTPUT"

  windows:
    name: Build (Windows, MSVC)
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: windows-2022
    env:
      # Signed with Azure Artifact Signing (Trusted Signing) once its secrets and variables are set
      # (docs/releasing.md#code-signing); unsigned until then.
      SIGN: ${{ secrets.AZURE_CLIENT_ID != '' && vars.ARTIFACT_SIGNING_PROFILE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639  # v1.2
        with:
          key: release-windows-msvc
          variant: sccache
          max-size: 2G
      # Steinberg's ASIO SDK 2.3.4, the first offered under GPLv3 as well as Steinberg's own licence: SUBstation
      # takes it under GPLv3 (docs/licensing.md). Pinned by its SHA-256; unpacked outside the checkout.
      - name: ASIO SDK
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'asiosdk.zip'
          Invoke-WebRequest -Uri 'https://download.steinberg.net/sdk_downloads/ASIO-SDK_2.3.4_2025-10-15.zip' -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($hash -ne 'd5ebf0c20dd2c5f43771fd0c1418f4b361bf52434ee670097cfa6b3a335e2eca') { throw "The ASIO SDK isn't the one pinned ($hash)." }
          $dir = Join-Path $env:RUNNER_TEMP 'asiosdk'
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          "SUBSTATION_ASIO_SDK=$(Join-Path $dir 'ASIOSDK')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      # (Quoted: PowerShell splits an unquoted -DNAME=a.b at the dot, so the suffix
      # canary.202610142032 reached CMake as "canary".)
      - name: Configure
        run: >
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release
          -DSUBSTATION_BUILD_TESTS=OFF -DSUBSTATION_TEST_PLUGINS=OFF
          "-DSUBSTATION_RELEASE_CHANNEL=${{ needs.plan.outputs.channel }}"
          "-DSUBSTATION_VERSION_SUFFIX=${{ needs.plan.outputs.suffix }}"
          "-DSUBSTATION_UPDATE_REPOSITORY=${{ github.repository }}"
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      - name: Build
        run: ninja -C build
      - name: Stage
        shell: pwsh
        run: >
          tools/release/package-windows.ps1 -Step Stage -Build build -Version '${{ needs.plan.outputs.version }}'
          -Out dist -Repository '${{ github.repository }}' -Commit '${{ github.sha }}'
      - name: Sign the programs
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\SUBstation
          files-folder-filter: substation*.exe
          description: SUBstation
          description-url: https://github.com/${{ github.repository }}
      - name: Archive and installer
        shell: pwsh
        run: |
          tools/release/package-windows.ps1 -Step Archive -Version '${{ needs.plan.outputs.version }}' -Out dist
          tools/release/package-windows.ps1 -Step Installer -Version '${{ needs.plan.outputs.version }}' -Out dist -Repository '${{ github.repository }}'
      - name: Sign the installer
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: '*-setup.exe'
          description: SUBstation Setup
          description-url: https://github.com/${{ github.repository }}
      - name: Checksums
        shell: pwsh
        run: |
          tools/release/package-windows.ps1 -Step Checksums -Out dist
          if ($env:SIGN -ne 'true') {
            Write-Output "::warning::Unsigned: set up code signing (docs/releasing.md#code-signing) before a stable release."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish
    needs: [plan, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = stable ]; then
            gh release create "$TAG" dist/* --repo "$REPO" --verify-tag --title "SUBstation $VERSION" \
              --generate-notes --latest
          else
            label=$([ "$CHANNEL" = nightly ] && echo Nightly || echo Canary)
            gh release create "$TAG" dist/* --repo "$REPO" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "SUBstation $VERSION ($label)" \
              --notes "$label build of $GITHUB_SHA. Not tested as a stable release is: Preferences › Updates › Stable for those."
          fi
      - name: Prune old pre-releases
        if: needs.plan.outputs.channel != 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          set -euo pipefail
          keep=$([ "$CHANNEL" = nightly ] && echo 7 || echo 10)
          gh release list --repo "$REPO" --limit 200 --json tagName --jq '.[].tagName' \
            | grep -E -- "-$CHANNEL\.[0-9]+$" | sort -t. -k4,4nr | tail -n +$((keep + 1)) \
            | while read -r tag; do
                echo "Deleting $tag"; gh release delete "$tag" --repo "$REPO" --yes --cleanup-tag
              done
